name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: version
        run: |
          version=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Fetch libretro cores
        run: |
          set -euo pipefail
          for abi in arm64-v8a armeabi-v7a; do
            dest="android/app/src/main/assets/cores/$abi"
            mkdir -p "$dest"
            curl -fSL -o "/tmp/core-$abi.zip" \
              "https://buildbot.libretro.com/nightly/android/latest/$abi/mupen64plus_next_gles3_libretro_android.so.zip"
            unzip -o -q "/tmp/core-$abi.zip" -d "$dest"
          done

      # Without the secrets the build falls back to the debug key, so a fork or
      # a first run still produces an installable APK.
      - name: Restore signing keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          # tr guards against stray whitespace picked up when the secret was set.
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/N64Launcher-${{ steps.version.outputs.value }}.apk"

      # The APK ships as a release asset only: build artifacts count against a
      # storage quota that release assets do not.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.value }}
          APK: build/N64Launcher-${{ steps.version.outputs.value }}.apk
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "N64 Launcher Mobile ${{ steps.version.outputs.value }}" \
              --notes-file .github/release-notes.md
          fi
